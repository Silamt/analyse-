<title>GvG Analyse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#f4f5f3; --surface:#ffffff; --surface2:#eceee9; --border:#d7dad2;
  --ink:#1c2024; --muted:#6a7078; --accent:#b6862c; --accent-soft:#f0e2c4;
  --good:#3f7d52; --bad:#b1483f;
  --shadow:0 1px 2px rgba(20,24,28,.06),0 4px 16px rgba(20,24,28,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14161a; --surface:#1b1e24; --surface2:#22262e; --border:#2f343d;
  --ink:#e7e9ec; --muted:#9aa1ad; --accent:#d9a441; --accent-soft:#3a2f18;
  --good:#5aa974; --bad:#cd6157;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#14161a; --surface:#1b1e24; --surface2:#22262e; --border:#2f343d;
  --ink:#e7e9ec; --muted:#9aa1ad; --accent:#d9a441; --accent-soft:#3a2f18;
  --good:#5aa974; --bad:#cd6157;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding:28px 20px 80px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;
  border-bottom:2px solid var(--border);padding-bottom:16px;margin-bottom:22px}
h1{font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;letter-spacing:.02em;
  font-size:30px;margin:0;text-transform:uppercase}
h1 .tick{color:var(--accent)}
.sub{color:var(--muted);font-size:13.5px;margin-top:2px}
.theme-btn{font:inherit;font-size:13px;color:var(--muted);background:var(--surface2);
  border:1px solid var(--border);border-radius:8px;padding:6px 12px;cursor:pointer}
.theme-btn:hover{color:var(--ink)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:16px;box-shadow:var(--shadow)}
.f label{display:block;font-family:"Barlow Semi Condensed",sans-serif;text-transform:uppercase;
  letter-spacing:.06em;font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:600}
select{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--surface2);
  border:1px solid var(--border);border-radius:9px;padding:8px 10px;cursor:pointer}
select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.reset{align-self:end}
.reset button{width:100%;font:inherit;font-weight:600;color:var(--ink);background:var(--accent-soft);
  border:1px solid var(--border);border-radius:9px;padding:8px 10px;cursor:pointer}
.kpis{display:flex;gap:14px;flex-wrap:wrap;margin:20px 0 8px}
.kpi{flex:1;min-width:130px;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi .n{font-family:"IBM Plex Mono",monospace;font-size:26px;font-weight:600;
  font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);overflow:hidden;margin-top:20px}
.panel h2{font-family:"Barlow Semi Condensed",sans-serif;text-transform:uppercase;
  letter-spacing:.03em;font-size:15px;margin:0;padding:14px 16px;border-bottom:1px solid var(--border);
  background:var(--surface2)}
.panel h2 small{color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0}
.picker{padding:14px 16px 4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.picker label{font-family:"Barlow Semi Condensed",sans-serif;text-transform:uppercase;
  letter-spacing:.06em;font-size:11px;color:var(--muted);font-weight:600}
.picker select{width:auto;min-width:240px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 16px;border-bottom:1px solid var(--border)}
th{font-family:"Barlow Semi Condensed",sans-serif;text-transform:uppercase;font-size:11px;
  letter-spacing:.05em;color:var(--muted);font-weight:600}
th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
th.sortable:hover{color:var(--ink)}
td.num,th.num{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:none}
.arch{font-weight:600}
.pct{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-weight:600}
.good{color:var(--good)} .bad{color:var(--bad)}
.n-small{color:var(--muted)}
.dhead{padding:10px 16px 2px;color:var(--muted);font-size:12.5px;
  font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:20px;
  background:var(--surface2);border:1px solid var(--border);color:var(--muted)}
.team{display:flex;flex-wrap:wrap;gap:5px 10px;align-items:center}
.u{display:inline-flex;align-items:center;gap:5px;font-size:13px;white-space:nowrap}
.pf{width:22px;height:22px;border-radius:50%;object-fit:cover;background:var(--surface2);flex:none}
.clickarch{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.clickarch:hover{color:var(--accent)}
.empty{padding:24px 16px;color:var(--muted);text-align:center}
summary.phead{font-family:"Barlow Semi Condensed",sans-serif;text-transform:uppercase;
  letter-spacing:.03em;font-size:15px;padding:14px 16px;background:var(--surface2);cursor:pointer;
  list-style:none;display:flex;align-items:center;gap:8px}
summary.phead::-webkit-details-marker{display:none}
summary.phead::before{content:"▸";color:var(--muted);font-size:12px}
details[open]>summary.phead::before{content:"▾"}
summary.phead:hover{color:var(--ink)}
summary.phead small{color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0}
details.panel[open]>summary.phead{border-bottom:1px solid var(--border)}
.rawscroll{max-height:460px;overflow:auto}
.rawscroll table{font-size:13px}
.res-ok{color:var(--good);font-weight:600} .res-fail{color:var(--bad);font-weight:600}
footer{margin-top:30px;color:var(--muted);font-size:12px;text-align:center}
</style>

<div class="wrap">
<header>
  <div>
    <h1>GvG <span class="tick">Analyse</span></h1>
    <div class="sub">Explorateur des données de Guerre de Guilde</div>
  </div>
  <div style="display:flex;gap:8px">
    <button class="theme-btn" id="dl">⬇ Télécharger (CSV)</button>
    <button class="theme-btn" id="theme">◐ Thème</button>
  </div>
</header>

<div class="filters" id="filters"></div>

<div class="kpis" id="kpis"></div>

<div class="panel">
  <h2>Meilleures défenses par archétype <small>— % d'attaques stoppées, toutes cartes</small></h2>
  <div id="defTable"></div>
</div>

<div class="panel">
  <h2>Meilleures teams attaques par type de défense <small>— choisis la défense</small></h2>
  <div class="picker"><label>Défense</label><select id="selDef"></select></div>
  <div id="atkTable"></div>
</div>

<div class="panel">
  <h2>Meilleures défenses par carte <small>— choisis la carte</small></h2>
  <div class="picker"><label>Carte</label><select id="selMap"></select></div>
  <div id="mapTable"></div>
</div>

<details class="panel" id="compoDetails">
  <summary class="phead">Composition des archétypes <small>— clique pour ouvrir</small></summary>
  <div class="picker"><label>Archétype</label><select id="selArch"></select></div>
  <div id="compoTable"></div>
</details>

<footer id="foot"></footer>
</div>

function chip(name){const id=PORT[name];

function goToArch(a){SEL_ARCH=a;render();

  if(d){d.open=true;d.scrollIntoView({behavior:"smooth",block:"start"});}}

const uniq = (k) => [...new Set(DATA.map(d=>d[k]).filter(x=>x!==null&&x!==undefined))].sort();
const SPECS = [
  {key:"guild", label:"Guilde affrontée", opts:()=>uniq("guild")},
  {key:"side",  label:"Camp", opts:()=>["nos attaques","leurs attaques"]},
  {key:"season",label:"Saison", opts:()=>uniq("season")},
  {key:"battle",label:"Bataille", opts:()=>uniq("battle")},
  {key:"map",   label:"Carte", opts:()=>uniq("map")},
  {key:"atkArch",label:"Archétype attaque", opts:()=>[...new Set(DATA.map(d=>d.atkArch))].sort()},
];

function buildFilters(){
  const c=document.getElementById("filters"); c.innerHTML="";
  for(const s of SPECS){
    const div=document.createElement("div"); div.className="f";
    const opts=['<option value="">— tous —</option>'].concat(
      s.opts().map(o=>`<option value="${o}">${o}</option>`)).join("");
    div.innerHTML=`<label>${s.label}</label><select data-k="${s.key}">${opts}</select>`;
    c.appendChild(div);
  }
  const r=document.createElement("div"); r.className="f reset";
  r.innerHTML=`<label>&nbsp;</label><button id="reset">Réinitialiser</button>`;
  c.appendChild(r);
  c.querySelectorAll("select").forEach(sel=>sel.addEventListener("change",e=>{
    F[e.target.dataset.k]=e.target.value; render();}));
  document.getElementById("reset").addEventListener("click",()=>{
    for(const k in F)F[k]="";
    c.querySelectorAll("select").forEach(s=>s.value=""); render();});
}

function filtered(){
  return DATA.filter(d=>{
    if(F.guild && d.guild!==F.guild)return false;
    if(F.side==="nos attaques" && !d.ours)return false;
    if(F.side==="leurs attaques" && d.ours)return false;
    if(F.season && String(d.season)!==String(F.season))return false;
    if(F.battle && d.battle!==F.battle)return false;
    if(F.map && d.map!==F.map)return false;
    if(F.atkArch && d.atkArch!==F.atkArch)return false;
    return true;
  });
}
const pctClass=(p)=>p>=50?"good":p<=25?"bad":"";

// ---- tri générique (tableau défenses par archétype) ----
const SORT={col:"rate",dir:-1};
function makeSortable(elId,cols,rows){
  const el=document.getElementById(elId);
  let rs=rows.slice();
  if(SORT.col!=null)rs.sort((a,b)=>{let x=a[SORT.col],y=b[SORT.col];
    return (typeof x==="string"?x.localeCompare(y,"fr"):x-y)*SORT.dir;});
  const head=cols.map(c=>{const on=SORT.col===c.key;const ar=on?(SORT.dir<0?" ▼":" ▲"):"";
    return `<th class="${c.num?"num ":""}sortable" data-k="${c.key}">${c.label}${ar}</th>`;}).join("");
  const body=rs.length?rs.map(r=>"<tr>"+cols.map(c=>`<td class="${c.num?"num":""}">${c.fmt(r)}</td>`).join("")+"</tr>").join("")
    :`<tr><td colspan="${cols.length}"><div class="empty">Aucune donnée avec ces filtres.</div></td></tr>`;
  el.innerHTML=`<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
  el.querySelectorAll("th.sortable").forEach(th=>th.addEventListener("click",()=>{
    const k=th.dataset.k; if(SORT.col===k)SORT.dir*=-1; else{SORT.col=k;SORT.dir=-1;} render();}));
}

function render(){
  const rows=filtered();
  const total=rows.length, fails=rows.filter(r=>!r.cleared).length;
  const failRate=total?Math.round(fails/total*100):0;
  document.getElementById("kpis").innerHTML=`
    <div class="kpi"><div class="n">${total}</div><div class="l">Affrontements</div></div>
    <div class="kpi"><div class="n">${fails}</div><div class="l">Défenses ayant tenu</div></div>
    <div class="kpi"><div class="n">${failRate}%</div><div class="l">Taux d'échec attaquant</div></div>`;

  // 1) défenses par archétype (>=10)
  const dm={};
  for(const r of rows){(dm[r.defArch]??=(dm[r.defArch]={faced:0,held:0}));dm[r.defArch].faced++;if(!r.cleared)dm[r.defArch].held++;}
  const dRows=Object.entries(dm).map(([a,v])=>({a,faced:v.faced,held:v.held,rate:v.held/v.faced*100})).filter(x=>x.faced>=10);
  makeSortable("defTable",[
    {key:"a",label:"Archétype",fmt:r=>`<span class="arch clickarch" data-a="${r.a}" title="Voir les compos ${r.a}">${r.a}</span>`},
    {key:"faced",label:"Attaques subies",num:true,fmt:r=>`<span class="n-small">${r.faced}</span>`},
    {key:"held",label:"Attaques stoppées",num:true,fmt:r=>r.held},
    {key:"rate",label:"% stoppées",num:true,fmt:r=>`<span class="pct ${pctClass(r.rate)}">${Math.round(r.rate)}%</span>`},
  ],dRows);

  // 2) attaques par type de défense (déroulant)
  const byDef={};
  for(const r of rows){const d=r.defArch;(byDef[d]??=(byDef[d]={faced:0,held:0,atk:{}}));
    byDef[d].faced++; if(!r.cleared)byDef[d].held++;
    (byDef[d].atk[r.atkArch]??=(byDef[d].atk[r.atkArch]={n:0,cl:0,surv:0}));
    const z=byDef[d].atk[r.atkArch]; z.n++; if(r.cleared)z.cl++; z.surv+=r.surv;}
  const defKeys=Object.entries(byDef).filter(([,v])=>v.faced>=10).sort((x,y)=>y[1].faced-x[1].faced).map(e=>e[0]);
  const selDef=document.getElementById("selDef"), atkT=document.getElementById("atkTable");
  if(!defKeys.length){selDef.innerHTML="";atkT.innerHTML=`<div class="empty">Aucune donnée avec ces filtres.</div>`;}
  else{
    if(!defKeys.includes(SEL_DEF))SEL_DEF=defKeys[0];
    selDef.innerHTML=defKeys.map(d=>`<option value="${d}"${d===SEL_DEF?" selected":""}>${d} — ${byDef[d].faced} attaques subies</option>`).join("");
    const draw=()=>{
      const v=byDef[SEL_DEF], hr=Math.round(v.held/v.faced*100);
      const atks=Object.entries(v.atk).map(([a,z])=>({a,n:z.n,cl:z.cl,rate:z.cl/z.n*100,surv:z.surv/z.n}))
        .filter(z=>z.n>=3).sort((x,y)=>y.rate-x.rate||y.surv-x.surv).slice(0,8);
      const body=atks.length?atks.map(z=>`<tr><td class="arch clickarch" data-a="${z.a}" title="Voir les compos ${z.a}">${z.a}</td>`+
        `<td class="num"><span class="pct ${pctClass(z.rate)}">${Math.round(z.rate)}%</span></td>`+
        `<td class="num">${z.surv.toFixed(1)}</td><td class="num n-small">${z.cl}/${z.n}</td></tr>`).join("")
        :`<tr><td colspan="4" class="n-small" style="padding:8px 16px">pas assez d'attaques (≥3)</td></tr>`;
      atkT.innerHTML=`<div class="dhead">Défense subie ${v.faced}× · stoppée ${v.held}× (${hr}% de défense réussie) — clique un archétype d’attaque pour voir ses compos</div>`+
        `<table><thead><tr><th>Archétype d’attaque</th><th class="num">Réussite</th>`+
        `<th class="num">Survie /5</th><th class="num">Détail</th></tr></thead><tbody>${body}</tbody></table>`;
      atkT.querySelectorAll(".clickarch").forEach(el=>el.addEventListener("click",()=>goToArch(el.dataset.a)));};
    selDef.onchange=()=>{SEL_DEF=selDef.value;draw();}; draw();
  }

  // 3) meilleures défenses par carte (déroulant)
  const mm={};
  for(const r of rows){const m=r.map;(mm[m]??=(mm[m]={}));const k=r.def.slice().sort().join(", ");
    (mm[m][k]??=(mm[m][k]={faced:0,held:0,arch:r.defArch,names:r.def.slice().sort()}));mm[m][k].faced++;if(!r.cleared)mm[m][k].held++;}
  const mapKeys=Object.keys(mm).sort((a,b)=>a.localeCompare(b,"fr"));
  const selMap=document.getElementById("selMap"), mapT=document.getElementById("mapTable");
  if(!mapKeys.length){selMap.innerHTML="";mapT.innerHTML=`<div class="empty">Aucune donnée avec ces filtres.</div>`;}
  else{
    if(!mapKeys.includes(SEL_MAP))SEL_MAP=mapKeys[0];
    selMap.innerHTML=mapKeys.map(m=>`<option value="${m}"${m===SEL_MAP?" selected":""}>${m}</option>`).join("");
    const draw=()=>{
      const list=Object.entries(mm[SEL_MAP]).map(([k,v])=>({k,faced:v.faced,held:v.held,rate:v.held/v.faced*100,arch:v.arch,names:v.names}))
        .filter(z=>z.faced>=2).sort((x,y)=>y.rate-x.rate||y.faced-x.faced).slice(0,10);
      const body=list.length?list.map(z=>`<tr><td>${team(z.names)} <span class="tag">${z.arch}</span></td>`+
        `<td class="num"><span class="pct ${pctClass(z.rate)}">${Math.round(z.rate)}%</span></td>`+
        `<td class="num n-small">${z.held}/${z.faced}</td></tr>`).join("")
        :`<tr><td colspan="3" class="n-small" style="padding:8px 16px">pas assez de données (≥2 attaques)</td></tr>`;
      mapT.innerHTML=`<table><thead><tr><th>Défense</th><th class="num">% stoppées</th>`+
        `<th class="num">Détail</th></tr></thead><tbody>${body}</tbody></table>`;};
    selMap.onchange=()=>{SEL_MAP=selMap.value;draw();}; draw();
  }

  // 4) compositions par archétype (déroulant)
  const cm={};
  const addT=(arch,names)=>{(cm[arch]??=(cm[arch]={}));const k=names.slice().sort().join(", ");cm[arch][k]=(cm[arch][k]||0)+1;};
  for(const r of rows){addT(r.defArch,r.def);addT(r.atkArch,r.atk);}
  const archKeys=Object.keys(cm).sort((a,b)=>a.localeCompare(b,"fr"));
  const selArch=document.getElementById("selArch"), compoT=document.getElementById("compoTable");
  if(!archKeys.length){selArch.innerHTML="";compoT.innerHTML=`<div class="empty">Aucune donnée avec ces filtres.</div>`;}
  else{
    if(!archKeys.includes(SEL_ARCH))SEL_ARCH=archKeys.includes("mago")?"mago":archKeys[0];
    selArch.innerHTML=archKeys.map(a=>`<option value="${a}"${a===SEL_ARCH?" selected":""}>${a}</option>`).join("");
    const draw=()=>{
      const list=Object.entries(cm[SEL_ARCH]).sort((x,y)=>y[1]-x[1]);
      const body=list.map(([c,n])=>`<tr><td>${team(c.split(", "))}</td><td class="num">${n}×</td></tr>`).join("");
      compoT.innerHTML=`<table><thead><tr><th>Composition observée (attaque + défense)</th>`+
        `<th class="num">Fois jouée</th></tr></thead><tbody>${body}</tbody></table>`;};
    selArch.onchange=()=>{SEL_ARCH=selArch.value;draw();}; draw();
  }

  document.getElementById("foot").textContent=
    `${DATA.length} affrontements au total · saison 26 · Les Joyeux Psychopathes`;
}

// ---- export CSV des données filtrées ----
function download(){
  const rows=filtered();
  const head=["bataille","saison","carte","guilde","camp","defense","archetype_def","attaque","archetype_atk","resultat","survivants"];
  const esc=s=>`"${String(s==null?"":s).replace(/"/g,'""')}"`;
  const lines=[head.join(",")];
  for(const r of rows){lines.push([r.battle,r.season,r.map,r.guild,r.ours?"nous":"eux",
    r.def.join(" | "),r.defArch,r.atk.join(" | "),r.atkArch,r.cleared?"percée":"tenue",r.surv].map(esc).join(","));}
  const blob=new Blob(["﻿"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download="gvg_analyse.csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}
document.getElementById("dl").addEventListener("click",download);

  const root=document.documentElement, btn=document.getElementById("theme");
  let t=null; try{t=localStorage.getItem("gvg-theme")}catch(e){}
  if(t)root.setAttribute("data-theme",t);
  btn.addEventListener("click",()=>{
    const cur=root.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
    const nxt=cur==="dark"?"light":"dark";
    root.setAttribute("data-theme",nxt);
    try{localStorage.setItem("gvg-theme",nxt)}catch(e){}});
})();

document.getElementById("defTable").addEventListener("click",e=>{
